<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 54px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 26px Arial, sans-serif; fill: #4b5563; }
      .axis { stroke: #94a3b8; stroke-width: 3; }
      .grid { stroke: #e2e8f0; stroke-width: 2; }
      .bar1 { fill: #64748b; }
      .bar2 { fill: #2b6cb0; }
      .bar3 { fill: #7c3aed; }
      .label { font: 700 25px Arial, sans-serif; fill: #111827; }
      .small { font: 400 21px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 18px Arial, sans-serif; fill: #6b7280; }
      .note { fill: #ffffff; stroke: #d1d5db; stroke-width: 3; rx: 14; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="80" y="92">Tracker Comparison</text>
  <text class="subtitle" x="82" y="135">Baseline metrics before the planned final retraining pass; lower ID switches are better, higher MOTA is better.</text>

  <text class="label" x="155" y="215">TOTAL MOTA</text>
  <line class="axis" x1="155" y1="640" x2="720" y2="640"/>
  <line class="axis" x1="155" y1="260" x2="155" y2="640"/>
  <line class="grid" x1="155" y1="560" x2="720" y2="560"/>
  <line class="grid" x1="155" y1="480" x2="720" y2="480"/>
  <line class="grid" x1="155" y1="400" x2="720" y2="400"/>
  <line class="grid" x1="155" y1="320" x2="720" y2="320"/>
  <text class="tiny" x="112" y="646">0.0</text>
  <text class="tiny" x="112" y="566">0.1</text>
  <text class="tiny" x="112" y="486">0.2</text>
  <text class="tiny" x="112" y="406">0.3</text>
  <text class="tiny" x="112" y="326">0.4</text>
  <text class="tiny" x="112" y="266">0.5</text>

  <rect class="bar1" x="225" y="263" width="90" height="377"/>
  <rect class="bar2" x="385" y="262" width="90" height="378"/>
  <rect class="bar3" x="545" y="262" width="90" height="378"/>
  <text class="small" x="225" y="680">Centroid</text>
  <text class="small" x="406" y="680">SORT</text>
  <text class="small" x="520" y="680">DeepSORT-lite</text>
  <text class="label" x="220" y="245">0.470</text>
  <text class="label" x="380" y="244">0.472</text>
  <text class="label" x="540" y="244">0.472</text>

  <text class="label" x="910" y="215">TOTAL ID Switches</text>
  <line class="axis" x1="910" y1="640" x2="1475" y2="640"/>
  <line class="axis" x1="910" y1="260" x2="910" y2="640"/>
  <line class="grid" x1="910" y1="576" x2="1475" y2="576"/>
  <line class="grid" x1="910" y1="512" x2="1475" y2="512"/>
  <line class="grid" x1="910" y1="448" x2="1475" y2="448"/>
  <line class="grid" x1="910" y1="384" x2="1475" y2="384"/>
  <line class="grid" x1="910" y1="320" x2="1475" y2="320"/>
  <text class="tiny" x="866" y="646">0</text>
  <text class="tiny" x="857" y="582">20</text>
  <text class="tiny" x="857" y="518">40</text>
  <text class="tiny" x="857" y="454">60</text>
  <text class="tiny" x="857" y="390">80</text>
  <text class="tiny" x="848" y="326">100</text>
  <text class="tiny" x="848" y="266">120</text>

  <rect class="bar1" x="980" y="262" width="90" height="378"/>
  <rect class="bar2" x="1140" y="326" width="90" height="314"/>
  <rect class="bar3" x="1300" y="317" width="90" height="323"/>
  <text class="small" x="980" y="680">Centroid</text>
  <text class="small" x="1161" y="680">SORT</text>
  <text class="small" x="1275" y="680">DeepSORT-lite</text>
  <text class="label" x="1001" y="245">118</text>
  <text class="label" x="1165" y="309">98</text>
  <text class="label" x="1320" y="300">101</text>

  <rect class="note" x="160" y="745" width="1280" height="80"/>
  <text class="small" x="200" y="780">Takeaway: SORT and DeepSORT-lite reduce identity switches relative to the centroid baseline,</text>
  <text class="small" x="200" y="812">but total MOTA stays close because detector errors remain the dominant bottleneck.</text>
</svg>
