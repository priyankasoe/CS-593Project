<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 54px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 26px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 28px Arial, sans-serif; fill: #111827; }
      .small { font: 400 22px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 18px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 3; rx: 14; }
      .done { fill: #e8f7ef; stroke: #2f9e64; }
      .partial { fill: #fff4de; stroke: #d99012; }
      .future { fill: #f2f4f8; stroke: #9ca3af; stroke-dasharray: 10 8; }
      .arrow { stroke: #475569; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
      .blue { fill: #dceeff; stroke: #2b6cb0; }
      .purple { fill: #ede9fe; stroke: #7c3aed; }
      .red { fill: #fee2e2; stroke: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="80" y="92">Learning-Based Tracking Pipeline</text>
  <text class="subtitle" x="82" y="135">Current implemented path: YOLO detections feed three identity trackers and MOT-style evaluation.</text>

  <rect class="box blue" x="90" y="255" width="260" height="145"/>
  <text class="label" x="130" y="315">Overhead Video</text>
  <text class="small" x="130" y="355">3-6 identical</text>
  <text class="small" x="130" y="385">Sphero robots</text>

  <path class="arrow" d="M 370 328 L 480 328"/>

  <rect class="box done" x="500" y="235" width="300" height="185"/>
  <text class="label" x="550" y="296">YOLO Detector</text>
  <text class="small" x="550" y="338">trained on CVAT</text>
  <text class="small" x="550" y="368">YOLO labels</text>
  <text class="tiny" x="550" y="400">Output: frame, box, confidence</text>

  <path class="arrow" d="M 820 328 L 930 328"/>

  <rect class="box purple" x="950" y="175" width="260" height="115"/>
  <text class="label" x="1000" y="225">Centroid</text>
  <text class="small" x="1000" y="260">distance baseline</text>

  <rect class="box purple" x="950" y="330" width="260" height="115"/>
  <text class="label" x="1028" y="380">SORT</text>
  <text class="small" x="1000" y="415">Kalman + IoU</text>

  <rect class="box purple" x="950" y="485" width="260" height="125"/>
  <text class="label" x="995" y="535">DeepSORT-lite</text>
  <text class="small" x="1000" y="570">Kalman + IoU</text>
  <text class="small" x="1000" y="598">+ HSV appearance</text>

  <path class="arrow" d="M 1225 232 L 1350 360"/>
  <path class="arrow" d="M 1225 388 L 1350 388"/>
  <path class="arrow" d="M 1225 548 L 1350 420"/>

  <rect class="box done" x="1365" y="315" width="170" height="135"/>
  <text class="label" x="1403" y="365">Metrics</text>
  <text class="small" x="1401" y="405">MOTA</text>
  <text class="small" x="1401" y="435">ID switches</text>

  <rect class="box future" x="500" y="600" width="300" height="135"/>
  <text class="label" x="540" y="652">Marker Branch</text>
  <text class="small" x="540" y="690">AprilTags / grid</text>
  <text class="tiny" x="540" y="720">remaining quantitative integration</text>

  <path class="arrow" d="M 350 370 C 420 500, 430 650, 480 665"/>

  <rect class="box partial" x="80" y="755" width="1440" height="75"/>
  <text class="small" x="115" y="803">Slide takeaway: the YOLO-to-tracking path is implemented; marker-based detection remains the main unfinished comparison branch.</text>
</svg>
